# ---------------------------------------------------------------------------
# Configuración de nginx para la SPA, pensada para ir **detrás** de Traefik.
# ---------------------------------------------------------------------------
#
# ## Por qué el panel escucha en 80
#
# El puerto 80 coincide con el puerto interno del dominio configurado en Dokploy. El proceso
# maestro de la imagen oficial abre el listener y los workers usan el usuario `nginx`; Traefik
# recibe el tráfico público y termina TLS.
#
# ## Por qué `index.html` NO se cachea y los assets sí
#
# Es la asimetría que separa una aplicación que se actualiza de una que no. Vite pone un hash
# en el nombre de cada asset, así que un nombre nuevo es siempre un fichero nuevo:
#
#   /assets/index-a1b2c3.js   ->  inmutable durante un año
#   /index.html               ->  nunca se cachea
#
# Cachear el `index.html` es el fallo clásico: el navegador pide el bundle antiguo, recibe la
# versión anterior de la aplicación, y el síntoma es "no me salen los cambios" con el
# servidor reiniciado y el despliegue hecho. Por eso aquí lleva `no-store` y no `no-cache`,
# que es más débil: `no-store` impide que el navegador **ni los guarde**.
#
# ## Sobre las cabeceras de seguridad
#
# Se emiten aquí y no solo en Traefik porque esta configuración se puede servir en cualquier
# entorno. `X-Frame-Options` y `nosniff` son la base, y la CSP va activa en forma estricta.
# Que no se haya podido ver en un navegador no la vuelve opcional: lo razonado se activa y se
# corrige con el dato del navegador delante, no al revés.
#
# ## Sobre la CSP
#
# Va **activa** y en su forma más restrictiva. Una CSP restrictiva mal calculada rompe la
# aplicación de forma difícil de diagnosticar —todo el JavaScript deja de cargar y la consola
# culpa a la propia CSP—, y eso es un problema. El problema de tenerla comentada es peor: sin
# nadie mirando, `X-Content-Type-Options` se convierte en el único enrutador de los payloads
# de XSS, y eso no lo detecta ninguna prueba.
#
# Lo único que `connect-src` necesita es el origen de la API, porque es el único sitio al que
# el panel habla. Si al desplegar aparece un origen legítimo bloqueado, se **añade** aquí y se
# documenta el motivo. Abrirlo a `*` no es la respuesta: se acaba sin política.

server {
    listen 80;
    server_name _;

    # El cliente usa VITE_API_URL y entra a la API por su dominio de Dokploy.
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Compresion
    # -------------------------------------------------------------------------
    # Se comprime el texto y nada mas. Comprimir imagenes ya comprimidas (PNG, JPEG, WebP)
    # gasta CPU para ganar nada medible, y en un contenedor con recursos limitados ese gasto
    # se paga en el primer=request real de un usuario.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Cabeceras de seguridad
    # -------------------------------------------------------------------------
    # Se aplican siempre, incluso en error: un `add_header` dentro de un `location` anula
    # **todos** los del nivel padre, de modo que poner uno solo en un `location` se lleva por
    # delante los demas en ese location. Por eso viven en un bloque que se incluye.
    include /etc/nginx/snippets/security-headers.conf;

    # -------------------------------------------------------------------------
    # Cache de assets con hash
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # index.html: nunca cacheado
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        # El include se repite aquí a propósito, y no por descuido: el `add_header`
        # de arriba acaba de anular los del nivel padre en este `location`, así que sin
        # repetirlo el `index.html` —que es justo la ruta que no se cachea— saldría sin
        # ninguna cabecera de seguridad.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # -------------------------------------------------------------------------
    # SPA: cualquier ruta desconocida devuelve el index
    # -------------------------------------------------------------------------
    # Sin esto, recargar en `/domains` daria un 404 de nginx y el usuario pensaria que la
    # ruta no existe. Es el comportamiento de una aplicacion de una sola pagina: el router
    # del cliente decide que se pinta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Ficheros que nunca se sirven
    # -------------------------------------------------------------------------
    # Un `.env` en un directorio público sale a Internet con solo que alguien adivine la ruta.
    # Este bloque hace que nginx responda 404 aunque el fichero exista en disco.
    location ~ /\.(env|git) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
}
