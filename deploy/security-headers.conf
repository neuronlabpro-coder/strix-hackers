# Cabeceras de seguridad de la SPA.
#
# ## Por qué van en un `include` aparte y no escritas en `nginx.conf`
#
# Por una razón concreta de nginx, no por estética: un `add_header` dentro de un `location`
# **anula todos** los del nivel padre. Es decir, añadir una cabecera en un `location` se lleva
# por delante las demás en ese mismo location sin avisar, y el síntoma es que una cabecera
# desaparece de una ruta concreta y nadie sabe por qué. Con un `include` explícito en los dos
# sitios donde hacen falta, es imposible que una se pierda por olvido.
#
# ## Por qué van en `snippets/` y no en `conf.d/`
#
# Porque el `nginx.conf` principal de la imagen hace `include /etc/nginx/conf.d/*.conf;` al
# nivel de `http`. Un fichero de cabeceras dejado ahí se cargaría **dos veces**: una por ese
# include global y otra por el nuestro. Duplicadas no rompen el panel —un navegador descarta
# la cabecera repetida— pero envían cada cabecera dos veces y hacen que la configuración
# aparente y la efectiva no coincidan, que es exactamente lo que vuelve loco al depurar.
#
# ## Sobre el `always`
#
# Está en todas para que se emitan también en respuestas de error. Sin él, un `404` del SPA
# sale sin ninguna, y un atacante puede provocar un error para comprobar qué revela la
# presencia de una ruta.
#
# ## ESTA CONFIGURACIÓN NO SE HA VISTO NUNCA EN UN NAVEGADOR
#
# En este proyecto no hay navegador conectado: todo el frontend está verificado por tipos,
# lint, build y comprobadores, nunca renderizado. La CSP de abajo es la forma **estricta**
# que se ha elegido por criterio, no una política que se haya visto funcionar. Si al abrir el
# panel el JavaScript deja de cargar, la causa más probable es la CSP y el mensaje aparece en
# la consola del navegador diciendo exactamente qué origen se rechazó. Estrechar primero y
# relajar después con el dato del navegador delante; relajar antes y endurecer nunca es como
# se acaba sin ninguna política.

# Evita que la página se incruste en un iframe de otro sitio (clickjacking).
add_header X-Frame-Options "DENY" always;

# Evita que el navegador interprete una respuesta con un tipo distinto del declarado. Es la
# cabecera que neutraliza el XSS por tipo MIME en el caso más simple.
add_header X-Content-Type-Options "nosniff" always;

# Lo que se envía a un tercero no sale de este dominio. Con `strict-origin-when-cross-origin` —y
# no `no-referrer`— las peticiones al propio sitio siguen llevando la referencia, que es lo que
# necesitan las métricas internas.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Desactiva las funciones de la API del navegador que ninguna vista usa y que amplían la
# superficie. No se incluye `interest-cohort`: formaba parte de FLoC, que los navegadores
# retiraron, y una directiva que ya no hace nada en ningún sitio es ruido que hace dudar de
# las que sí hacen.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=()" always;

# La CSP no lleva `unsafe-inline` en `script-src`, y esa es la parte que importa.
#
# `style-src` lo necesita: el bundle de Vite inyecta estilos en línea y sin esta excepción la
# página se queda sin estilos. `script-src` no lo necesita, porque los scripts de un build de
# producción son ficheros externos con hash. Ponerlo ahí equivaldría a desactivar la
# protección principal de la CSP —justo lo que un payload de XSS necesita para ejecutar
# código de cadena— a cambio de proteger contra algo que no va a ocurrir.
#
# `connect-src` permite el origen de la API porque el panel es un cliente HTTP, y es el único
# destino al que habla. `frame-ancestors 'none'` es la modernización de `X-Frame-Options`, y
# se emiten las dos: la segunda la ignoran los navegadores que no la implementan.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; # El origen de la API se inyecta en el arranque del contenedor, no se escribe aquí.
    #
    # El origen de la API se declara **exacto**, y hay un gate que lo contrasta con
    # `API_PUBLIC_BASE_URL`.
    #
    # ## Por qué un literal y no una variable de entorno
    #
    # Porque nginx **no sustituye** `${VAR}` dentro de un fichero de configuración: solo lo hace
    # en la línea de comando, y con `env VAR;` declarado en el contexto `main`, que este fichero
    # no tiene. Una plantilla renderizada en el arranque sería la solución correcta para un
    # despliegue con varios dominios.
    #
    # ## Por qué no se ha hecho aquí, y qué se hace en su lugar
    #
    # Porque hacer depender la cabecera de un `sed` en el arranque introduce una dependencia de
    # orden: si la sustitución falla, el contenedor arranca con una CSP que no protege y **no dice
    # nada**. Un literal equivocado se ve en el primer `git diff`; una CSP rota en silencio
    # protege durante meses.
    #
    # Lo que hay, y es lo que evita la deriva de verdad, es el test de cabeceras del frontend:
    # lee este fichero y `API_PUBLIC_BASE_URL`, y falla si no coinciden. El literal es la
    # fuente, y el gate es lo que obliga a actualizarla cuando cambia el dominio.
    #
    # ## Por qué no un comodín
    #
    # Porque `connect-src` es a dónde puede enviar datos el panel, y el token vive en
    # `sessionStorage` de ese mismo origen. Un `*` ahí permite que cualquier página que se
    # ejecute en el origen del panel mande las peticiones que quiera.
    connect-src 'self' https://api.mindguardredteam.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'" always;

# El HSTS **no** se emite desde aquí a propósito, y la razón no es el olvido: lo emite el
# terminador TLS —Traefik—, que es quien sabe si el certificado se renueva. Si esta cabecera
# llegara con un `max-age` de un año y el certificado caducara sin renovarse, el navegador
# dejaría de poder alcanzar el dominio, y el fallo persistiría mucho después de arreglar el
# certificado. Activar HSTS es una decisión de una sola dirección.
