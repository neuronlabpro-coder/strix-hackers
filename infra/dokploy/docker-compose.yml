services:
  fenix-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configurar POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?configurar POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configurar POSTGRES_PASSWORD}
    ports:
      - "${TAILSCALE_BIND_IP:?configurar TAILSCALE_BIND_IP}:5433:5432"
    volumes:
      - fenix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  fenix-redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?configurar REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?configurar REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${TAILSCALE_BIND_IP:?configurar TAILSCALE_BIND_IP}:6380:6379"
    volumes:
      - fenix_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  fenix_postgres_data:
  fenix_redis_data:
