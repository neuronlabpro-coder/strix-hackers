[project]
name = "mind-guard-fenix-backend"
version = "0.1.0"
description = "Backend de control multi-tenant de Mind Guard Fenix Team"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0",
    "celery[redis]>=5.4.0",
    "cryptography>=43.0.0",
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.4.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30.0",
    "stripe>=11.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.401",
    "ruff>=0.11.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: pruebas contra la base de datos configurada",
]
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"backend/tests/**/*.py" = ["S101", "S105", "S106"]
"backend/migrations/**/*.py" = ["E402", "E501", "I001", "UP007", "UP035"]
"migrations/**/*.py" = ["E402", "E501", "I001", "UP007", "UP035"]

[tool.pyright]
extraPaths = [".."]
